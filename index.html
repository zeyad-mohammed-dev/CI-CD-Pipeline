<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker CI/CD Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b12;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      color: #a1a1aa;
      font-size: 18px;
    }

    .badge {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 18px;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      color: #c4b5fd;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello Docker 🐳</h1>
    <p>My first application running inside a Docker container.</p>

    <div class="badge">
      Docker + Nginx + Alpine
    </div>
  </div>
</body>
</html>
